name: 🚀 Deploy to FTP

on:
  push:
    branches:
      - main

concurrency:
  group: n1foto-ftp-deploy
  cancel-in-progress: false

jobs:
  deploy-site:
    runs-on: ubuntu-latest

#steps
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🌱 Initialize editable ornament data if missing
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 .github/scripts/seed-shary-data.py

      - name: 📤 Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./               
          server-dir: /n1foto.com/public_html/
          exclude: |
            **/.git*
            **/.vscode/**
            **/node_modules/**
            **/*.scss
            admin-deploy/**
            db/main-page-cards.json
            db/poligrafy.json
            db/pages/vizitki.json
            db/pages/pechat-na-odezhde.json
            db/pages/tablichki.json
            db/pages/nakleyki.json
            db/pages/pechat-i-kopirovanie.json
            db/pages/shary.json
            img/buklety/uploads/**
            img/listovki/uploads/**
            img/odezhda/uploads/**
            img/tablichki/uploads/**
            img/nakleyki/uploads/**
            img/pechat-i-kopirovanie/uploads/**
            img/karmannye-kalendariki/uploads/**
            img/main-page/uploads/**
            img/shary/uploads/**

  deploy-admin:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 📤 Deploy admin via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./admin-deploy/
          server-dir: /admin_n1foto_com/public_html/
          exclude: |
            **/.git*
            **/.vscode/**
            **/node_modules/**
            storage/sessions/**

